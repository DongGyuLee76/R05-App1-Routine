{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1 class="card-title" style="font-size: 1.5rem;">월별 리포트 히스토리 (Monthly History)</h1>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">과거 기록을 바탕으로 연도별, 월별 달성률을 확인하세요.</p>
    
    <div style="background: var(--bg-color); padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: flex-end;">
            <div style="flex: 1;">
                <label class="form-label" for="filterYear" style="margin-bottom: 0.25rem;">연도 (Year)</label>
                <input type="text" id="filterYear" class="form-control" list="yearList" value="2026" placeholder="연도 4자리 입력 (예: 2026)" autocomplete="off">
                <datalist id="yearList">
                    <option value="전체">연도 전체 보기</option>
                </datalist>
            </div>
            <div style="flex: 1;">
                <label class="form-label" for="filterMonth" style="margin-bottom: 0.25rem;">월 (Month)</label>
                <select id="filterMonth" class="form-control">
                    <option value="all">월 전체 (All)</option>
                    <option value="01">1월</option>
                    <option value="02">2월</option>
                    <option value="03">3월</option>
                    <option value="04">4월</option>
                    <option value="05">5월</option>
                    <option value="06">6월</option>
                    <option value="07">7월</option>
                    <option value="08">8월</option>
                    <option value="09">9월</option>
                    <option value="10">10월</option>
                    <option value="11">11월</option>
                    <option value="12">12월</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <div style="flex: 1; text-align: center;">
                <button id="searchHistoryBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 0.5rem; height: 42px;">월별 세부 보고서 검색</button>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0; line-height: 1.3;">선택한 연도와 월에 해당하는<br>세부 월간 데이터를 출력합니다.</p>
            </div>
            <div style="flex: 1; text-align: center;">
                <button id="yearlyReportBtn" class="btn" style="width: 100%; margin-bottom: 0.5rem; height: 42px; background: var(--text-primary); color: white; border: none; border-radius: 4px; font-weight: 500; cursor: pointer;">연도별 통합 보고서 출력</button>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0; line-height: 1.3;">선택한 연도의 1년 치 전체 데이터를<br>합산한 종합 보고서를 출력합니다.</p>
            </div>
        </div>
    </div>
    
    <div id="historyList">
        <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">데이터 로딩 중...</p>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-title">
        <span>회원 관리 (Admin Console)</span>
        <button class="btn btn-primary" onclick="showAddUserModal()">+ 신규 회원 추가</button>
    </div>
    
    <div class="table-wrapper">
        <table class="table" id="users-table">
            <thead>
                <tr>
                    <th>아이디</th>
                    <th>권한</th>
                    <th>생성일시</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="users-list">
                <!-- Javascript가 채워넣음 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 회원 추가/수정 모달 -->
<div id="user-modal" class="modal" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div class="card" style="width: 400px; margin: auto; background: white; padding: 2rem; position: relative; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
        <h3 id="modal-title" style="margin-bottom: 1.5rem;">신규 회원 추가</h3>
        <div id="modal-error" class="alert alert-danger" style="display:none;"></div>
        <input type="hidden" id="edit-user-id">
        
        <div class="form-group">
            <label class="form-label" for="modal-username">아이디</label>
            <input type="text" id="modal-username" class="form-control" placeholder="아이디">
        </div>
        <div class="form-group">
            <label class="form-label" for="modal-password">비밀번호 (수정 시 빈칸이면 유지)</label>
            <input type="password" id="modal-password" class="form-control" placeholder="비밀번호">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            <input type="checkbox" id="modal-is-admin" style="width: auto;">
            <label class="form-label" for="modal-is-admin" style="margin-bottom: 0; cursor: pointer;">관리자 권한 부여</label>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
            <button class="btn btn-outline" onclick="closeUserModal()">취소</button>
            <button class="btn btn-primary" id="save-user-btn" onclick="saveUser()">저장</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadUsers();
});

async function loadUsers() {
    try {
        const response = await fetch('/api/admin/users');
        if (!response.ok) throw new Error('회원 정보를 불러오는데 실패했습니다.');
        const users = await response.json();
        
        const tbody = document.getElementById('users-list');
        tbody.innerHTML = '';
        
        users.forEach(user => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${user.username}</strong></td>
                <td>
                    <span class="badge ${user.is_admin ? 'badge-admin' : 'badge-user'}">
                        ${user.is_admin ? '관리자' : '일반회원'}
                    </span>
                </td>
                <td>${new Date(user.created_at).toLocaleString('ko-KR')}</td>
                <td>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" onclick="showEditUserModal(${user.id}, '${user.username}', ${user.is_admin})">수정</button>
                        ${user.username !== 'admin' ? `<button class="btn btn-danger" onclick="deleteUser(${user.id}, '${user.username}')">삭제</button>` : ''}
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        alert(err.message);
    }
}

function showAddUserModal() {
    document.getElementById('modal-title').textContent = '신규 회원 추가';
    document.getElementById('edit-user-id').value = '';
    document.getElementById('modal-username').value = '';
    document.getElementById('modal-username').disabled = false;
    document.getElementById('modal-password').value = '';
    document.getElementById('modal-is-admin').checked = false;
    document.getElementById('modal-error').style.display = 'none';
    
    const modal = document.getElementById('user-modal');
    modal.style.display = 'flex';
}

function showEditUserModal(id, username, isAdmin) {
    document.getElementById('modal-title').textContent = `${username} 회원 수정`;
    document.getElementById('edit-user-id').value = id;
    document.getElementById('modal-username').value = username;
    document.getElementById('modal-username').disabled = true; // 아이디 수정 불가
    document.getElementById('modal-password').value = '';
    document.getElementById('modal-is-admin').checked = isAdmin;
    document.getElementById('modal-error').style.display = 'none';
    
    // 기본 admin 계정은 권한 변경 불가하게 처리
    if (username === 'admin') {
        document.getElementById('modal-is-admin').disabled = true;
    } else {
        document.getElementById('modal-is-admin').disabled = false;
    }
    
    const modal = document.getElementById('user-modal');
    modal.style.display = 'flex';
}

function closeUserModal() {
    document.getElementById('user-modal').style.display = 'none';
}

async function saveUser() {
    const id = document.getElementById('edit-user-id').value;
    const username = document.getElementById('modal-username').value.trim();
    const password = document.getElementById('modal-password').value.trim();
    const isAdmin = document.getElementById('modal-is-admin').checked;
    const errorDiv = document.getElementById('modal-error');
    
    errorDiv.style.display = 'none';
    
    if (!id && (!username || !password)) {
        errorDiv.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    const url = id ? `/api/admin/users/${id}` : '/api/admin/users';
    const method = id ? 'PUT' : 'POST';
    const body = id ? { password, is_admin: isAdmin } : { username, password, is_admin: isAdmin };
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || '저장에 실패했습니다.');
        }
        
        closeUserModal();
        loadUsers();
    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
    }
}

async function deleteUser(id, username) {
    if (!confirm(`정말로 ${username} 회원을 삭제하시겠습니까? 해당 회원의 모든 루틴 데이터가 영구 삭제됩니다.`)) {
        return;
    }
    
    try {
        const response = await fetch(`/api/admin/users/${id}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            const result = await response.json();
            throw new Error(result.error || '삭제에 실패했습니다.');
        }
        
        loadUsers();
    } catch (err) {
        alert(err.message);
    }
}
</script>
<style>
.badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 9999px;
}
.badge-admin {
    background-color: rgba(79, 70, 229, 0.1);
    color: var(--primary-color);
}
.badge-user {
    background-color: var(--bg-color);
    color: var(--text-secondary);
}
</style>
{% endblock %}
